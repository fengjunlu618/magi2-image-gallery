<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>图片目录 | 强！又一国产AI生图开源模型发布！现在免费用！</title>
<style>
:root{
  --bg:#0f1115; --bg2:#161920; --card:#1c2029; --card-h:#242936;
  --line:#2b3140; --txt:#e8ebf2; --sub:#9aa3b5; --accent:#6d8cff;
  --accent2:#b06cff; --chip:#232838; --shadow:0 10px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:60px;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}

/* HERO */
.hero{
  background:radial-gradient(1200px 400px at 15% -10%,rgba(109,140,255,.25),transparent 60%),
             radial-gradient(900px 400px at 90% 0%,rgba(176,108,255,.18),transparent 60%),
             linear-gradient(160deg,#151a26,#0f1115);
  border-bottom:1px solid var(--line);padding:52px 0 40px;
}
.badge{
  display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.5px;
  color:#c9d4ff;background:rgba(109,140,255,.12);border:1px solid rgba(109,140,255,.3);
  padding:6px 14px;border-radius:100px;margin-bottom:20px;
}
.badge .dot{width:7px;height:7px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent)}
h1{font-size:clamp(24px,4vw,40px);font-weight:800;letter-spacing:-.5px;line-height:1.3;margin-bottom:14px}
.hero .meta{color:var(--sub);font-size:14px;margin-bottom:26px}
.hero .meta b{color:var(--accent);font-weight:600}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 20px;min-width:104px;
}
.stat .num{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .lbl{font-size:12px;color:var(--sub);margin-top:2px}
.src-link{
  display:inline-flex;align-items:center;gap:6px;margin-top:24px;font-size:13px;color:#c9d4ff;
  border:1px solid var(--line);padding:9px 16px;border-radius:10px;transition:.2s;
}
.src-link:hover{border-color:var(--accent);background:var(--card)}

/* TOOLBAR */
.toolbar{
  position:sticky;top:0;z-index:50;background:rgba(15,17,21,.85);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:28px;
}
.toolbar-inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.fbtn{
  font-size:13px;color:var(--sub);background:var(--chip);border:1px solid transparent;
  padding:8px 15px;border-radius:9px;cursor:pointer;transition:.2s;white-space:nowrap;
}
.fbtn:hover{color:var(--txt);border-color:var(--line)}
.fbtn.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;font-weight:600}
.view-tip{font-size:12px;color:var(--sub)}
@media(max-width:760px){
  .view-tip{display:none}
  .filters{width:100%;flex:none}
  .toolbar{padding:12px 0}
}

/* GALLERY */
.gallery{columns:4;column-gap:18px}
@media(max-width:1080px){.gallery{columns:3}}
@media(max-width:760px){.gallery{columns:2;column-gap:12px}}
@media(max-width:480px){.gallery{columns:1}}

.card{
  break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;margin-bottom:18px;transition:transform .25s,border-color .25s,box-shadow .25s;
}
@media(max-width:480px){.card{margin-bottom:14px}}
.card:hover{transform:translateY(-4px);border-color:#3a4356;box-shadow:var(--shadow)}
.thumb{position:relative;cursor:zoom-in;background:#0a0c10;overflow:hidden}
.thumb img{width:100%;height:auto;display:block;transition:transform .4s}
.card:hover .thumb img{transform:scale(1.04)}
.thumb .idx{
  position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;color:#fff;
  background:rgba(0,0,0,.6);backdrop-filter:blur(6px);padding:4px 9px;border-radius:7px;
  font-variant-numeric:tabular-nums;
}
.thumb .cat-tag{
  position:absolute;top:10px;right:10px;font-size:10px;color:#fff;
  background:linear-gradient(135deg,rgba(109,140,255,.9),rgba(176,108,255,.9));
  padding:4px 10px;border-radius:7px;
}
.thumb .zoom-hint{
  position:absolute;bottom:10px;right:10px;font-size:11px;color:#fff;
  background:rgba(0,0,0,.55);padding:4px 9px;border-radius:7px;opacity:0;transition:.2s;
}
.card:hover .zoom-hint{opacity:1}
.card-body{padding:14px 15px 15px}
.card-title{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.4}
.card-desc{font-size:12.5px;color:var(--sub);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}
.prompt-btn{
  font-size:11.5px;color:#c9d4ff;background:rgba(109,140,255,.1);border:1px solid rgba(109,140,255,.25);
  padding:5px 11px;border-radius:7px;cursor:pointer;transition:.2s;
}
.prompt-btn:hover{background:rgba(109,140,255,.2)}
.dl-btn{
  font-size:11.5px;color:var(--sub);background:transparent;border:1px solid var(--line);
  padding:5px 11px;border-radius:7px;transition:.2s;
}
.dl-btn:hover{color:var(--txt);border-color:var(--accent)}
.prompt-panel{
  max-height:0;overflow:hidden;transition:max-height .35s ease;
  border-top:1px solid transparent;
}
.prompt-panel.open{max-height:600px;border-top-color:var(--line)}
.prompt-inner{padding:13px 15px}
.prompt-inner .lbl{font-size:10px;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:7px}
.prompt-inner .txt{font-size:12px;color:#c3cbd9;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}

/* LIGHTBOX */
.lb{position:fixed;inset:0;z-index:200;background:rgba(6,8,12,.94);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:24px}
.lb.show{display:flex}
.lb-stage{position:relative;max-width:1000px;width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:20px}
.lb-img{max-width:78%;max-height:88vh;object-fit:contain;border-radius:10px;box-shadow:0 20px 70px rgba(0,0,0,.6)}
.lb-side{width:280px;flex-shrink:0;max-height:88vh;overflow:auto}
.lb-num{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:1px}
.lb-title{font-size:20px;font-weight:800;margin:8px 0 12px}
.lb-desc{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:18px}
.lb-prompt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.lb-prompt .lbl{font-size:10px;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:8px}
.lb-prompt .txt{font-size:12px;color:#c3cbd9;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto}
.lb-dl{display:block;text-align:center;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
  padding:11px;border-radius:9px;font-weight:600}
.lb-close{position:absolute;top:16px;right:20px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:22px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
.lb-close:hover{background:rgba(255,255,255,.2)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:24px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
.lb-nav:hover{background:rgba(255,255,255,.2)}
.lb-prev{left:14px}.lb-next{right:14px}
@media(max-width:820px){
  .lb-stage{flex-direction:column;justify-content:flex-start;overflow:auto;gap:14px;padding-top:50px}
  .lb-img{max-width:100%;max-height:55vh}
  .lb-side{width:100%;max-height:none;padding-bottom:30px}
  .lb-nav{top:auto;bottom:16px;transform:none}
  .lb-close{top:10px;right:12px}
}
.empty{text-align:center;color:var(--sub);padding:60px 20px;display:none}
.footer{text-align:center;color:var(--sub);font-size:12px;margin-top:50px;padding-top:24px;border-top:1px solid var(--line)}
.footer a{color:var(--accent)}
</style>
</head>

const CATS = ['全部', ...new Set(DATA.map(x=>x.cat))];
const gallery = document.getElementById('gallery');
const filters = document.getElementById('filters');
const empty = document.getElementById('empty');
let currentCat = '全部';

function renderFilters(){
  filters.innerHTML = CATS.map(c=>{
    const n = c==='全部' ? DATA.length : DATA.filter(x=>x.cat===c).length;
    return `<button class="fbtn ${c===currentCat?'active':''}" data-cat="${c}">${c} <span style="opacity:.6">${n}</span></button>`;
  }).join('');
  filters.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{
    currentCat=b.dataset.cat; renderFilters(); render();
  });
}

function render(){
  const list = currentCat==='全部' ? DATA : DATA.filter(x=>x.cat===currentCat);
  empty.style.display = list.length? 'none':'block';
  gallery.innerHTML = list.map((x,i)=>`
    <div class="card" data-idx="${x.idx}">
      <div class="thumb" onclick="openLB(${x.idx})">
        <img src="${x.file}" alt="${x.title}" loading="lazy">
        <span class="idx">${String(x.idx+1).padStart(2,'0')}</span>
        <span class="cat-tag">${x.cat}</span>
        <span class="zoom-hint">点击放大 ⤢</span>
      </div>
      <div class="card-body">
        <div class="card-title">${x.title}</div>
        <div class="card-desc">${x.desc}</div>
        <div class="card-foot">
          ${x.prompt?`<button class="prompt-btn" onclick="togglePrompt(${x.idx},this)">生成提示词</button>`:'<span></span>'}
          <a class="dl-btn" href="${x.file}" download>下载 ${x.size_kb}KB</a>
        </div>
      </div>
      ${x.prompt?`<div class="prompt-panel" id="pp-${x.idx}"><div class="prompt-inner"><div class="lbl">生成提示词</div><div class="txt">${x.prompt}</div></div></div>`:''}
    </div>`).join('');
}

function togglePrompt(idx,btn){
  const p=document.getElementById('pp-'+idx);
  const opening=!p.classList.contains('open');
  p.classList.toggle('open',opening);
  btn.textContent = opening?'收起提示词':'生成提示词';
}

// Lightbox
let lbIdx=0, lbList=[];
const lb=document.getElementById('lb');
function openLB(idx){
  lbList = currentCat==='全部' ? DATA : DATA.filter(x=>x.cat===currentCat);
  lbIdx = lbList.findIndex(x=>x.idx===idx);
  if(lbIdx<0) lbIdx=0;
  showLB();
  lb.classList.add('show');
  document.body.style.overflow='hidden';
}
function showLB(){
  const x=lbList[lbIdx];
  document.getElementById('lbImg').src=x.file;
  document.getElementById('lbNum').textContent=`${lbIdx+1} / ${lbList.length} · ${x.cat}`;
  document.getElementById('lbTitle').textContent=x.title;
  document.getElementById('lbDesc').textContent=x.desc;
  document.getElementById('lbPromptWrap').innerHTML = x.prompt
    ? `<div class="lb-prompt"><div class="lbl">生成提示词</div><div class="txt">${x.prompt}</div></div>` : '';
  const dl=document.getElementById('lbDl');
  dl.href=x.file; dl.download=x.file.split('/').pop();
}
function closeLB(){lb.classList.remove('show');document.body.style.overflow='';}
function navLB(d){lbIdx=(lbIdx+d+lbList.length)%lbList.length;showLB();}
document.getElementById('lbClose').onclick=closeLB;
document.getElementById('lbPrev').onclick=e=>{e.stopPropagation();navLB(-1)};
document.getElementById('lbNext').onclick=e=>{e.stopPropagation();navLB(1)};
lb.onclick=e=>{if(e.target===lb)closeLB()};
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('show'))return;
  if(e.key==='Escape')closeLB();
  if(e.key==='ArrowLeft')navLB(-1);
  if(e.key==='ArrowRight')navLB(1);
});

renderFilters();render();
</script>
</body>
</html>
